  - endpoint_code: public_api_encounter_actors
    route_template: /reports/{reportId}/encounters/{encounterId}/actors
    method: GET
    auth_mode: bearer_api_key_events_read_on_request
    status: reviewed
    use: official_single_encounter_actor_dictionary
    parameter_keys: []
    dimension_keys: []
    scope_path_keys:
      - reportId
