  - endpoint_code: public_api_encounter_events
    route_template: /reports/{reportId}/encounters/{encounterId}/events
    method: GET
    auth_mode: bearer_api_key_events_read_on_request
    status: reviewed
    use: official_single_encounter_combat_event_stream
    parameter_keys:
      - groups
      - event_types
      - melee_only
      - source_ids
      - target_ids
      - spell_ids
      - start_ms
      - end_ms
      - limit
