prohibited_assumptions:
  - statistics total_parses is identical to the site's tier-list popularity algorithm
  - the public statistics API exposes builds talents gear enchants armory or guild progression
  - event rows alone prove a mechanic applies universally outside the observed encounter
  - null glancing or crushing flags prove the mechanic was absent
  - event-level access is self-serve or available to every API key
