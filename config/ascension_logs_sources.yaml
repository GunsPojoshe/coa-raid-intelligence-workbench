required_event_fields:
  - encounter_id
  - timestamp_ms
  - event_type
  - source_actor_id
  - target_actor_id
  - spell_id

optional_event_fields:
  - stacks
  - source_class_code
  - source_spec_code
  - target_type
  - ability_name
  - game_version

prohibited_assumptions:
  - class presence implies effect coverage
  - equal display names imply equal aura state
  - one observed application proves raid-wide scope
  - absence in one log disproves a mechanic
  - old and new game versions are directly interchangeable
  - upstream detected specialization proves a provider mechanic
  - a route name proves response semantics
  - a newly observed field may enter planner scoring without semantic review
