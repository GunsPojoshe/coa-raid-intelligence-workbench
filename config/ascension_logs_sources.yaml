schema_version: 5
source_code: coa_ascension_logs
base_url: https://coa.ascensionlogs.gg
status: discovery
truth_role: primary_observation_source

principles:
  - raw responses are immutable and content-addressed
  - browser network captures are primary discovery evidence for live frontend behavior
  - route discovery is separate from production ingestion
  - observations are stored before any mechanic inference
  - inferred mechanics never overwrite contradictory evidence
  - newer observations receive greater weight through a versioned policy
  - guild and global samples are retained as separate cohorts
  - upstream class and spec labels are retained as derived observations, not raw mechanic truth
  - reviewed network contracts are preferred over frontend-internal inference
  - source changes create scoped reanalysis requests instead of global rebuilds

