name: Verify repository

on:
  pull_request:
  push:
    branches: [e2/log-evidence-refactor]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-release-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch pull-request refs for history audit
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin '+refs/pull/*/head:refs/remotes/origin/pr/*'
      - name: Audit all reachable Git objects
        run: python scripts/audit_public_release.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: public-readiness-report
          path: artifacts/public-readiness-report.json
          if-no-files-found: error
          retention-days: 3

  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run python scripts/verify_repo.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-report-ubuntu
          path: artifacts/verification-report.json
          if-no-files-found: warn
          retention-days: 3

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run pytest
      - run: uv run coa-workbench doctor --project-root .
      - name: Initialize DuckDB twice
        shell: pwsh
        run: |
          $database = Join-Path $env:RUNNER_TEMP "coa.duckdb"
          uv run coa-workbench init-db --database $database --migrations migrations
          uv run coa-workbench init-db --database $database --migrations migrations
