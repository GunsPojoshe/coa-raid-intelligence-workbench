name: Verify repository

on:
  pull_request:
  push:
    branches:
      - e2/log-evidence-refactor
      - e3/real-log-capture
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-release-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch pull-request refs for history audit
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin '+refs/pull/*/head:refs/remotes/origin/pr/*'
      - name: Audit all reachable Git objects
        run: python scripts/audit_public_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ failure() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          name: public-readiness-report
          path: artifacts/public-readiness-report.json
          if-no-files-found: error
          retention-days: 3

  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.0"
          enable-cache: false
      - run: uv sync --frozen --extra dev
      - run: uv run python scripts/verify_repo.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ failure() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          name: verification-report-ubuntu
          path: artifacts/verification-report.json
          if-no-files-found: warn
          retention-days: 3

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.0"
          enable-cache: false
      - run: uv sync --frozen --extra dev
      - run: uv run pytest
      - run: uv run coa-workbench doctor --project-root .
      - name: Initialize DuckDB twice
        shell: pwsh
        run: |
          $database = Join-Path $env:RUNNER_TEMP "coa.duckdb"
          uv run coa-workbench init-db --database $database --migrations migrations
          uv run coa-workbench init-db --database $database --migrations migrations
