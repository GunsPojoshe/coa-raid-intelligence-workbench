name: Verify repository

on:
  pull_request:
  push:
    branches: [e2/log-evidence-refactor]

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run python scripts/verify_repo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-report-ubuntu
          path: artifacts/verification-report.json
          if-no-files-found: warn

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run pytest
      - run: uv run coa-workbench doctor --project-root .
      - name: Initialize DuckDB twice
        shell: pwsh
        run: |
          $database = Join-Path $env:RUNNER_TEMP "coa.duckdb"
          uv run coa-workbench init-db --database $database --migrations migrations
          uv run coa-workbench init-db --database $database --migrations migrations
