[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coa-raid-intelligence-workbench"
version = "0.1.0"
description = "Localhost-first raid planning application for CoA"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "CoA Raid Intelligence Workbench"}]
dependencies = [
  "duckdb>=1.1,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "openpyxl>=3.1,<4", "pytest>=8,<10"]

[project.scripts]
coa-workbench = "coa_workbench.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"coa_workbench.web" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
